name: Load test

on:
  workflow_dispatch:
    inputs:
      users:
        description: Number of virtual users to ramp up
        required: false
        default: '20'
      rampSeconds:
        description: Ramp-up duration, in seconds
        required: false
        default: '10'

jobs:
  gatling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start mock API
        run: |
          mvn --batch-mode -q test-compile exec:java > mock-server.log 2>&1 &
          echo $! > mock-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/users > /dev/null; then
              echo "mock API is up"
              exit 0
            fi
            sleep 1
          done
          echo "mock API did not start in time" >&2
          cat mock-server.log
          exit 1

      - name: Run Gatling load test
        run: >
          mvn --batch-mode test-compile gatling:test
          -Dgatling.users=${{ github.event.inputs.users }}
          -Dgatling.rampSeconds=${{ github.event.inputs.rampSeconds }}

      - name: Stop mock API
        if: always()
        run: kill "$(cat mock-server.pid)" || true

      - name: Upload Gatling report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-report
          path: target/gatling/**
          retention-days: 14
